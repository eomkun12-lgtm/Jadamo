<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JADAMO 다이빙 지구본</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background-color:#05091b;background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.75) 0 1px,transparent 1.5px),radial-gradient(circle at 82% 75%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),radial-gradient(circle at 62% 30%,rgba(143,220,214,.55) 0 1px,transparent 1.5px);background-size:87px 91px,131px 117px,157px 143px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.globe-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.globe{position:relative;width:min(78vw,920px);aspect-ratio:1;overflow:hidden;border:2px solid rgba(222,255,252,.72);border-radius:50%;background:#9dc5cd;box-shadow:0 0 0 10px rgba(164,229,224,.08),0 30px 70px rgba(0,0,0,.5),inset -35px -25px 50px rgba(27,72,86,.2)}#map{width:100%;height:100%;background:#9dc5cd}.maplibregl-canvas{filter:saturate(.42) brightness(1.15) contrast(.87)}.maplibregl-ctrl-attrib{padding:3px 7px!important;color:#0d4653!important;background:rgba(238,250,249,.82)!important;font-size:8px!important}.maplibregl-ctrl-attrib a{color:#067d89!important}.maplibregl-ctrl-group{margin:0 22px 22px 0!important;border:1px solid rgba(5,41,54,.22)!important;border-radius:10px!important;overflow:hidden;background:rgba(238,250,249,.9)!important}.maplibregl-ctrl-group button+button{border-color:rgba(5,41,54,.14)!important}.maplibregl-ctrl-group button span{filter:brightness(.45) sepia(1) hue-rotate(135deg)}.globe-shine{position:absolute;z-index:3;inset:0;pointer-events:none;border-radius:50%;background:radial-gradient(circle at 28% 23%,rgba(255,255,255,.4),transparent 30%),radial-gradient(circle at 65% 68%,transparent 40%,rgba(8,29,46,.25) 100%)}.map-note{position:absolute;z-index:8;top:22px;right:22px;width:202px;padding:13px 14px;border:1px solid rgba(167,236,227,.24);border-radius:13px;color:#d6f5f0;background:rgba(4,37,52,.86);box-shadow:0 15px 42px rgba(0,0,0,.24);backdrop-filter:blur(14px)}.map-note span{display:block;margin-bottom:8px;color:#75d9cb;font-size:7px;font-weight:800;letter-spacing:.17em}.map-note strong{display:block;font-size:11px;letter-spacing:.06em}.map-note small{display:block;margin-top:5px;color:rgba(225,250,246,.58);font-size:9px;line-height:1.45}.info{position:absolute;z-index:7;left:22px;bottom:24px;min-width:214px;padding:13px 15px;border:1px solid rgba(255,255,255,.18);border-radius:13px;color:#fff;background:rgba(4,37,52,.8);backdrop-filter:blur(14px)}.info span,.info small{display:block}.info span{margin-bottom:7px;color:#8fd8d1;font-size:7px;font-weight:750;letter-spacing:.16em}.info strong{font-size:12px;letter-spacing:.08em}.info small{margin-top:4px;color:rgba(255,255,255,.55);font-size:9px}.marker{position:relative;width:18px;height:18px;padding:0;border:0;background:transparent;cursor:pointer}.core{position:absolute;left:4px;top:4px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#22b9ae;box-shadow:0 0 0 5px rgba(69,220,203,.2),0 5px 16px rgba(0,0,0,.32)}.marker.is-ongoing .core{background:#f2775b;box-shadow:0 0 0 5px rgba(242,119,91,.2),0 5px 16px rgba(0,0,0,.32)}.marker.is-completed .core{background:#607c98;box-shadow:0 0 0 5px rgba(96,124,152,.2),0 5px 16px rgba(0,0,0,.32)}.marker.is-active .core{width:14px;height:14px;left:2px;top:2px;background:#f2c45f;box-shadow:0 0 0 7px rgba(242,196,95,.24),0 5px 18px rgba(0,0,0,.38)}.tag{display:none;position:absolute;left:25px;top:-12px;min-width:98px;padding:8px 10px;border:1px solid rgba(255,255,255,.28);border-radius:7px;color:#fff;background:rgba(4,40,57,.9);box-shadow:0 8px 25px rgba(0,0,0,.28);white-space:nowrap}.marker.is-active .tag,.marker:focus-visible .tag{display:block}.tag b,.tag small{display:block}.tag b{font-size:9px;letter-spacing:.12em}.tag small{margin-top:2px;color:#94ded4;font-size:8px;letter-spacing:.1em}.marker.is-active .tag small{color:#f7d98f}@media(max-width:600px){.globe{width:112vw}.map-note{top:14px;right:14px;width:180px}.info{left:14px;bottom:18px}.maplibregl-ctrl-group{margin-right:14px!important}}
    body.flat .globe-wrap{display:block;padding:18px}body.flat .globe{width:100%;height:100%;aspect-ratio:auto;border-radius:4px;border-color:rgba(222,255,252,.35);box-shadow:0 18px 50px rgba(0,0,0,.35),inset -20px -15px 40px rgba(27,72,86,.16)}body.flat .globe-shine{border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.15),transparent 28%,transparent 74%,rgba(8,29,46,.18))}body.flat .map-note{top:38px;right:40px}@media(max-width:600px){body.flat .globe-wrap{padding:10px}body.flat .map-note{top:24px;right:24px}}
  </style>
</head>
<body><script>if(new URLSearchParams(location.search).get('mode')==='flat')document.body.classList.add('flat')</script>
  <div class="globe-wrap"><div class="globe"><div id="map"></div><div class="globe-shine"></div></div></div>
  <div class="map-note"><span>JADAMO OCEAN ATLAS</span><strong>다이빙 지구본 탐색</strong><small>지구본을 드래그해 목적지를 둘러보세요.</small></div>
  <div class="info"><span>REGISTERED DESTINATIONS</span><strong id="selected-name">여행지를 불러오는 중</strong><small id="selected-detail">등록된 목적지를 표시합니다.</small></div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script>
    const isFlat=new URLSearchParams(location.search).get('mode')==='flat';const home={center:[128,28],zoom:isFlat?1.25:1.8,bearing:0};const style={version:8,sources:{ocean:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'ocean',type:'raster',source:'ocean',paint:{'raster-saturation':-.45,'raster-contrast':-.1,'raster-brightness-min':.35,'raster-brightness-max':.95}}]};
    const map=new maplibregl.Map({container:'map',style,...home,minZoom:0,maxZoom:5,renderWorldCopies:false,aroundCenter:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    let registered=[],pendingDestinations=null,globeReady=false,selectedId=null;const markers=[];const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const valid=item=>Number.isFinite(Number(item?.latitude))&&Number.isFinite(Number(item?.longitude));const normalise=item=>({...item,latitude:Number(item.latitude),longitude:Number(item.longitude)});
    function markerElement(item){const el=document.createElement('button');el.type='button';el.className='marker is-'+(item.status||'planned')+(item.id===selectedId?' is-active':'');el.setAttribute('aria-label',(item.name||'여행지')+' 선택');el.innerHTML='<span class="core"></span><span class="tag"><b>'+esc(item.name).toUpperCase()+'</b><small>'+esc((item.month||'TBD')+' · '+String(item.year||'').slice(-2))+'</small></span>';return el}
    function render(items=registered){markers.splice(0).forEach(marker=>marker.remove());items.forEach(item=>{const marker=new maplibregl.Marker({element:markerElement(item),anchor:'center'}).setLngLat([item.longitude,item.latitude]).addTo(map);marker.getElement().addEventListener('click',()=>select(item,true));markers.push(marker)})}
    function fit(items=registered){if(!items.length)return; if(items.length===1){map.flyTo({center:[items[0].longitude,items[0].latitude],zoom:3.05,duration:650});return}const bounds=items.reduce((box,item)=>box.extend([item.longitude,item.latitude]),new maplibregl.LngLatBounds([items[0].longitude,items[0].latitude],[items[0].longitude,items[0].latitude]));map.fitBounds(bounds,{padding:72,maxZoom:3.05,duration:750})}
    function setInfo(title,detail){document.getElementById('selected-name').textContent=title;document.getElementById('selected-detail').textContent=detail}function select(item,notify=false){if(!item)return;selectedId=item.id;render(registered);map.flyTo({center:[item.longitude,item.latitude],zoom:3.2,duration:650});setInfo(item.name||'여행지',(item.month||'TBD')+' '+(item.year||'')+' · '+(item.region||'등록 여행'));if(notify)parent.postMessage({type:'atlas-selected-destination',id:item.id},location.origin)}function reset(){selectedId=null;render(registered);fit(registered);setInfo('JADAMO OCEAN ATLAS','등록된 여행 목적지를 탐색해 보세요.')}
    function applyDestinations(data){registered=(data.destinations||[]).filter(valid).map(normalise);selectedId=registered.some(item=>item.id===data.activeId)?data.activeId:(registered[0]?.id||null);render();fit();const active=registered.find(item=>item.id===selectedId);if(active)setInfo(active.name,(active.month||'TBD')+' '+(active.year||'')+' · '+(active.region||'등록 여행'))}
    new ResizeObserver(()=>{map.resize();map.triggerRepaint()}).observe(document.getElementById('map'));map.on('style.load',()=>{if(!isFlat)map.setProjection({type:'globe'});requestAnimationFrame(()=>requestAnimationFrame(()=>{map.resize();map.jumpTo(home);map.triggerRepaint();globeReady=true;if(pendingDestinations){applyDestinations(pendingDestinations);pendingDestinations=null}}))});
    window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='atlas-focus-destination'){const item=valid(data.destination)?normalise(data.destination):null;if(item)select(item);return}if(data.type==='atlas-focus-country'){const items=(data.destinations||[]).filter(valid).map(normalise);fit(items);setInfo((data.countryFlag||'🌍')+' '+(data.countryName||'여행 국가'),items.length+'개의 등록 여행');return}if(data.type==='atlas-focus-trips'){const items=(data.destinations||[]).filter(valid).map(normalise);fit(items);setInfo('🧭 '+(data.participantName||'여행 참석자'),items.length+'개의 참여 여행');return}if(data.type==='atlas-reset-view'){reset();return}if(data.type!=='atlas-destinations')return;if(!globeReady){pendingDestinations=data;return}applyDestinations(data)});
  </script>
</body>
</html>
