<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JADAMO 다이빙 지도</title>
  <link href="/vendor/leaflet/leaflet.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:#062a39;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.leaflet-container{background:#9dc5cd}.leaflet-tile{filter:saturate(.68) brightness(1.04) contrast(.93)}.leaflet-control-attribution{padding:3px 7px!important;color:#0d4653!important;background:rgba(238,250,249,.82)!important;font-size:8px!important}.leaflet-control-zoom{margin:0 22px 22px 0!important;border:1px solid rgba(5,41,54,.22)!important;border-radius:10px!important;overflow:hidden}.leaflet-control-zoom a{color:#0d4653!important;background:rgba(238,250,249,.9)!important;border-color:rgba(5,41,54,.14)!important}.map-note,.info{position:absolute;z-index:700;border:1px solid rgba(167,236,227,.24);border-radius:13px;color:#d6f5f0;background:rgba(4,37,52,.86);box-shadow:0 15px 42px rgba(0,0,0,.24);backdrop-filter:blur(14px)}.map-note{top:22px;right:22px;width:210px;padding:13px 14px}.map-note span,.info span{display:block;margin-bottom:8px;color:#75d9cb;font-size:7px;font-weight:800;letter-spacing:.17em}.map-note strong{display:block;font-size:11px;letter-spacing:.06em}.map-note small,.info small{display:block;margin-top:5px;color:rgba(225,250,246,.62);font-size:9px;line-height:1.45}.map-views{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}.map-views button{height:27px;border:0;border-radius:6px;color:rgba(225,250,246,.72);background:rgba(255,255,255,.1);font-size:9px;cursor:pointer}.map-views button.active{color:#07304a;background:#d8f3f2;font-weight:800}.info{left:22px;bottom:24px;min-width:214px;padding:13px 15px}.info strong{display:block;font-size:12px;letter-spacing:.08em}.marker{position:relative;width:18px;height:18px}.core{position:absolute;left:4px;top:4px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#22b9ae;box-shadow:0 0 0 5px rgba(69,220,203,.2),0 5px 16px rgba(0,0,0,.32)}.marker.is-ongoing .core{background:#f2775b}.marker.is-completed .core{background:#607c98}.marker.is-active .core{width:14px;height:14px;left:2px;top:2px;background:#f2c45f;box-shadow:0 0 0 7px rgba(242,196,95,.24),0 5px 18px rgba(0,0,0,.38)}.tag{display:none;position:absolute;left:25px;top:-12px;min-width:98px;padding:8px 10px;border:1px solid rgba(255,255,255,.28);border-radius:7px;color:#fff;background:rgba(4,40,57,.9);box-shadow:0 8px 25px rgba(0,0,0,.28);white-space:nowrap}.marker.is-active .tag{display:block}.tag b,.tag small{display:block}.tag b{font-size:9px;letter-spacing:.12em}.tag small{margin-top:2px;color:#94ded4;font-size:8px;letter-spacing:.1em}@media(max-width:600px){.map-note{top:14px;right:14px;width:190px}.info{left:14px;bottom:18px}.leaflet-control-zoom{margin-right:14px!important}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="map-note"><span>JADAMO OCEAN ATLAS</span><strong>다이빙 지역 지도</strong><small>실제 지리 좌표에 맞춘 지도를 선택하세요.</small><div class="map-views"><button type="button" data-view="ocean" class="active">해양</button><button type="button" data-view="satellite">위성</button><button type="button" data-view="terrain">지형</button></div></div>
  <div class="info"><span>REGISTERED DESTINATIONS</span><strong id="selected-name">여행지를 불러오는 중</strong><small id="selected-detail">등록된 여행 목적지를 표시합니다</small></div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const map=L.map('map',{center:[22,125],zoom:3,minZoom:2,maxZoom:18,zoomControl:false,worldCopyJump:false,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1});
    const layers={ocean:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Ocean basemap © Esri, GEBCO, NOAA'}),satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles © Esri'}),terrain:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:13,attribution:'Terrain © Esri'})};layers.ocean.addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);
    let registered=[],selectedId=null;const markers=L.layerGroup().addTo(map);const valid=item=>Number.isFinite(Number(item?.latitude))&&Number.isFinite(Number(item?.longitude));const normalise=item=>({...item,latitude:Number(item.latitude),longitude:Number(item.longitude)});const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function markerIcon(item){const active=item.id===selectedId;return L.divIcon({className:'marker is-'+(item.status||'planned')+(active?' is-active':''),iconSize:[18,18],iconAnchor:[9,9],html:'<span class="core"></span><span class="tag"><b>'+esc(item.name).toUpperCase()+'</b><small>'+esc((item.month||'TBD')+' · '+String(item.year||'').slice(-2))+'</small></span>'})}
    function render(items=registered){markers.clearLayers();items.forEach(item=>L.marker([item.latitude,item.longitude],{icon:markerIcon(item)}).on('click',()=>select(item,true)).addTo(markers))}
    function fit(items=registered){if(!items.length)return;if(items.length===1){map.flyTo([items[0].latitude,items[0].longitude],6,{duration:.65});return}map.fitBounds(items.map(item=>[item.latitude,item.longitude]),{padding:[72,72],maxZoom:5,animate:true,duration:.75})}
    function setInfo(title,detail){document.getElementById('selected-name').textContent=title;document.getElementById('selected-detail').textContent=detail}function select(item,notify=false){if(!item)return;selectedId=item.id;render();map.flyTo([item.latitude,item.longitude],6,{duration:.65});setInfo(item.name||'여행지',(item.month||'TBD')+' '+(item.year||'')+' · '+(item.region||'등록 여행'));if(notify)parent.postMessage({type:'atlas-selected-destination',id:item.id},location.origin)}function reset(){selectedId=null;render();fit();setInfo('JADAMO OCEAN ATLAS','등록된 여행 목적지를 탐색해 보세요.')}
    function applyDestinations(data){registered=(data.destinations||[]).filter(valid).map(normalise);selectedId=registered.some(item=>item.id===data.activeId)?data.activeId:(registered[0]?.id||null);render();fit();const active=registered.find(item=>item.id===selectedId);if(active)setInfo(active.name,(active.month||'TBD')+' '+(active.year||'')+' · '+(active.region||'등록 여행'))}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{Object.values(layers).forEach(layer=>map.removeLayer(layer));layers[button.dataset.view].addTo(map);document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));markers.bringToFront()}));new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
    window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='atlas-focus-destination'){const item=valid(data.destination)?normalise(data.destination):null;if(item)select(item);return}if(data.type==='atlas-focus-country'){const items=(data.destinations||[]).filter(valid).map(normalise);fit(items);setInfo((data.countryFlag||'🌐')+' '+(data.countryName||'여행 국가'),items.length+'개의 등록 여행');return}if(data.type==='atlas-focus-trips'){const items=(data.destinations||[]).filter(valid).map(normalise);fit(items);setInfo('✦ '+(data.participantName||'여행 참석자'),items.length+'개의 참여 여행');return}if(data.type==='atlas-reset-view'){reset();return}if(data.type==='atlas-destinations')applyDestinations(data)});
  </script>
</body>
</html>
