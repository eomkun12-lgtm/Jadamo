<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JADAMO 다이빙 지도</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--ink:#dff4ef;--muted:#8fb1ae;--deep:#052733;--panel:rgba(4,37,49,.9);--accent:#4fc3b5}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:#8fbec3;font-family:Arial,"Noto Sans KR",sans-serif}#map{min-height:250px}.maplibregl-canvas{outline:none}.maplibregl-ctrl-bottom-right{right:15px;bottom:15px}.maplibregl-ctrl-group{overflow:hidden;border:1px solid rgba(6,54,66,.22);border-radius:12px!important;background:rgba(239,250,247,.9)!important;box-shadow:0 9px 26px rgba(4,34,45,.15)!important}.maplibregl-ctrl-group button{width:32px;height:32px}.maplibregl-ctrl-attrib{padding:3px 7px!important;color:#315d62!important;background:rgba(239,250,247,.82)!important;font-size:8px!important}.maplibregl-ctrl-attrib a{color:#315d62!important}.map-note,.info,.map-state{position:absolute;z-index:2;border:1px solid rgba(181,232,224,.25);border-radius:14px;color:var(--ink);background:var(--panel);box-shadow:0 15px 42px rgba(1,24,32,.22);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}.map-note{top:20px;right:20px;width:216px;padding:13px 14px}.map-note span,.info span{display:block;margin-bottom:7px;color:var(--accent);font-size:8px;font-weight:800;letter-spacing:.16em}.map-note strong{display:block;font-size:12px;letter-spacing:.04em}.map-note small,.info small{display:block;margin-top:5px;color:var(--muted);font-size:9px;line-height:1.45}.map-views{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}.map-views button{height:28px;border:1px solid transparent;border-radius:8px;color:#b9d2cf;background:rgba(255,255,255,.08);font-size:9px;font-weight:700;cursor:pointer;transition:transform .18s ease,background .18s ease,color .18s ease}.map-views button:hover{background:rgba(255,255,255,.14)}.map-views button:active{transform:scale(.97)}.map-views button:focus-visible{outline:2px solid #91e0d6;outline-offset:2px}.map-views button.active{color:#073340;background:#d9f3ef}.info{left:20px;bottom:20px;min-width:218px;padding:13px 15px}.info strong{display:block;font-size:12px;letter-spacing:.06em}.map-state{top:50%;left:50%;padding:10px 13px;color:#dff4ef;font-size:10px;transform:translate(-50%,-50%);transition:opacity .2s ease}.map-state[hidden]{display:none}.marker{position:absolute;width:22px;height:22px;padding:0;border:0;background:transparent;cursor:pointer}.marker::before{content:"";position:absolute;inset:5px;border:2px solid #f4fffc;border-radius:50%;background:#39b8aa;box-shadow:0 0 0 5px rgba(52,184,169,.2),0 5px 15px rgba(1,27,35,.3)}.marker.is-ongoing::before{background:#ef775d}.marker.is-completed::before{background:#64889b}.marker.is-active::before{inset:2px;background:#f1c45d;box-shadow:0 0 0 7px rgba(241,196,93,.24),0 7px 19px rgba(1,27,35,.38)}.tag{display:none;position:absolute;left:29px;top:-12px;min-width:112px;padding:8px 10px;border:1px solid rgba(255,255,255,.25);border-radius:9px;color:#eefaf7;background:rgba(4,38,50,.92);box-shadow:0 8px 24px rgba(1,27,35,.28);white-space:nowrap}.marker.is-active .tag{display:block}.tag b,.tag small{display:block}.tag b{font-size:9px;letter-spacing:.1em}.tag small{margin-top:3px;color:#91d9d0;font-size:8px;letter-spacing:.07em}@media(max-width:600px){.map-note{top:12px;right:12px;width:190px}.info{left:12px;bottom:12px;min-width:190px}.maplibregl-ctrl-bottom-right{right:8px;bottom:8px}.map-note small{display:none}}@media(prefers-reduced-motion:reduce){.map-views button,.map-state{transition:none}}@media(prefers-reduced-transparency:reduce){.map-note,.info,.map-state{background:#052d3a;backdrop-filter:none;-webkit-backdrop-filter:none}}
  </style>
</head>
<body>
  <div id="map" aria-label="JADAMO 여행지 세계 지도"></div>
  <div class="map-note"><span>JADAMO OCEAN ATLAS</span><strong>다이빙 지역 지도</strong><small>여행지를 선택해 항로와 기록을 탐색하세요.</small><div class="map-views" role="group" aria-label="지도 배경 선택"><button type="button" data-view="ocean" class="active">해양</button><button type="button" data-view="satellite">위성</button><button type="button" data-view="terrain">지형</button></div></div>
  <div class="info" aria-live="polite"><span>REGISTERED DESTINATIONS</span><strong id="selected-name">여행지를 불러오는 중</strong><small id="selected-detail">등록된 여행 목적지를 표시합니다</small></div>
  <div class="map-state" id="map-state">지도를 불러오는 중</div>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script>
    const styles={ocean:'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',satellite:{version:8,sources:{satellite:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Tiles © Esri'}},layers:[{id:'satellite',type:'raster',source:'satellite'}]},terrain:'https://tiles.openfreemap.org/styles/bright'};
    const map=new maplibregl.Map({container:'map',style:styles.ocean,center:[125,22],zoom:2.5,minZoom:1.7,maxZoom:18,renderWorldCopies:false,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    let registered=[],selectedId=null,markers=[],ready=false;const valid=item=>Number.isFinite(Number(item?.latitude))&&Number.isFinite(Number(item?.longitude));const normalise=item=>({...item,latitude:Number(item.latitude),longitude:Number(item.longitude)});const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=reduceMotion?0:700;
    map.scrollZoom.disable();map.getCanvas().addEventListener('wheel',event=>{event.preventDefault();const scale=[.002,.05,1][event.deltaMode]||.002;const zoom=Math.min(map.getMaxZoom(),Math.max(map.getMinZoom(),map.getZoom()-event.deltaY*scale));map.easeTo({center:map.getCenter(),zoom,duration:reduceMotion?0:120})},{passive:false});
    function markerElement(item){const element=document.createElement('button');element.type='button';element.className='marker is-'+(item.status||'planned')+(item.id===selectedId?' is-active':'');element.setAttribute('aria-label',(item.name||'여행지')+' 지도에서 선택');element.innerHTML='<span class="tag"><b>'+esc(item.name).toUpperCase()+'</b><small>'+esc((item.month||'TBD')+' '+String(item.year||''))+'</small></span>';element.addEventListener('click',()=>select(item,true));return element}
    function render(items=registered){markers.forEach(marker=>marker.remove());markers=items.map(item=>new maplibregl.Marker({element:markerElement(item),anchor:'center'}).setLngLat([item.longitude,item.latitude]).addTo(map))}
    function fit(items=registered){if(!items.length)return;if(items.length===1){map.flyTo({center:[items[0].longitude,items[0].latitude],zoom:6,duration});return}const bounds=items.reduce((box,item)=>box.extend([item.longitude,item.latitude]),new maplibregl.LngLatBounds([items[0].longitude,items[0].latitude],[items[0].longitude,items[0].latitude]));map.fitBounds(bounds,{padding:72,maxZoom:5,duration})}
    function setInfo(title,detail){document.getElementById('selected-name').textContent=title;document.getElementById('selected-detail').textContent=detail}function select(item,notify=false){if(!item)return;selectedId=item.id;render();map.flyTo({center:[item.longitude,item.latitude],zoom:6,duration});setInfo(item.name||'여행지',(item.month||'TBD')+' '+(item.year||'')+' / '+(item.region||'등록 여행'));if(notify)parent.postMessage({type:'atlas-selected-destination',id:item.id},location.origin)}function reset(){selectedId=null;render();fit();setInfo('JADAMO OCEAN ATLAS','등록된 여행 목적지를 탐색해 보세요.')}
    function applyDestinations(data){registered=(data.destinations||[]).filter(valid).map(normalise);selectedId=registered.some(item=>item.id===data.activeId)?data.activeId:(registered[0]?.id||null);render();fit();const active=registered.find(item=>item.id===selectedId);if(active)setInfo(active.name,(active.month||'TBD')+' '+(active.year||'')+' / '+(active.region||'등록 여행'));else setInfo('등록된 여행지가 없습니다','여행지를 추가하면 지도에 자동으로 표시됩니다.')}
    map.on('load',()=>{ready=true;document.getElementById('map-state').hidden=true;render();fit()});map.on('style.load',()=>{ready=true;document.getElementById('map-state').hidden=true});map.on('error',event=>{if(!ready){const state=document.getElementById('map-state');state.textContent='지도를 불러오지 못했습니다';state.hidden=false}console.error(event.error)});
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{if(button.classList.contains('active'))return;ready=false;const state=document.getElementById('map-state');state.hidden=false;state.textContent='지도 배경을 바꾸는 중';map.once('styledata',()=>{ready=true;state.hidden=true});map.setStyle(styles[button.dataset.view]);document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button))}));
    window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='atlas-focus-destination'){const item=valid(data.destination)?normalise(data.destination):null;if(item)select(item);return}if(data.type==='atlas-focus-country'){const items=(data.destinations||[]).filter(valid).map(normalise);fit(items);setInfo((data.countryFlag||'')+' '+(data.countryName||'여행 국가'),items.length+'개의 등록 여행');return}if(data.type==='atlas-focus-trips'){const items=(data.destinations||[]).filter(valid).map(normalise);fit(items);setInfo(data.participantName||'여행 참석자',items.length+'개의 참여 여행');return}if(data.type==='atlas-reset-view'){reset();return}if(data.type==='atlas-destinations')applyDestinations(data)});
  </script>
</body>
</html>
