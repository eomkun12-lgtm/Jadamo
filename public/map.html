<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>실시간 여행 지도</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{background:#0b2327;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#map{min-height:520px}.maplibregl-ctrl-attrib{padding:3px 7px!important;color:#afc9c2!important;background:rgba(5,18,20,.76)!important;font-size:8px!important}.maplibregl-ctrl-attrib a{color:#b7e5d8!important}.maplibregl-ctrl-group{margin:0 24px 28px 0!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:11px!important;overflow:hidden;background:rgba(8,25,27,.82)!important}.maplibregl-ctrl-group button+button{border-color:rgba(255,255,255,.1)!important}.maplibregl-ctrl-group button span{filter:invert(1)}.shade{position:absolute;z-index:2;inset:0;pointer-events:none;box-shadow:inset 0 0 65px rgba(2,13,15,.28)}.layers{position:absolute;z-index:4;top:22px;right:22px;width:204px;padding:13px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(5,35,55,.82);box-shadow:0 16px 45px rgba(0,0,0,.22);backdrop-filter:blur(18px)}.layers>span{display:block;margin:0 2px 10px;color:rgba(255,255,255,.45);font-size:7px;font-weight:750;letter-spacing:.18em}.segment{padding:3px;display:grid;grid-template-columns:repeat(2,1fr);border-radius:9px;background:rgba(0,0,0,.23)}button{height:31px;border:0;border-radius:7px;color:rgba(255,255,255,.56);background:transparent;font-size:10px;cursor:pointer}.segment button.active{color:#07304a;background:#d8f3f2;font-weight:720}.depth{width:100%;padding:9px 3px 1px;display:flex;align-items:center;gap:8px;text-align:left}.depth i{width:8px;height:8px;border:1px solid rgba(255,255,255,.45);border-radius:50%}.depth.active{color:#c7eeea}.depth.active i{border-color:#a9e7d4;background:#56c8bd;box-shadow:0 0 0 4px rgba(117,206,181,.12)}.info{position:absolute;z-index:3;left:22px;bottom:24px;min-width:214px;padding:14px 16px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(5,35,55,.76);backdrop-filter:blur(15px)}.info span,.info small{display:block}.info span{margin-bottom:7px;color:#8fd8d1;font-size:7px;font-weight:750;letter-spacing:.16em}.info strong{font-size:12px;letter-spacing:.08em}.info small{margin-top:4px;color:rgba(255,255,255,.5);font-size:9px}.marker{position:relative;width:20px;height:20px}.core{position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:#e5fff5;box-shadow:0 0 18px #a5f5da}.pulse{position:absolute;left:-3px;top:-3px;width:26px;height:26px;border:1px solid rgba(205,255,236,.85);border-radius:50%;animation:pulse 2.2s ease-out infinite}.tag{position:absolute;left:27px;top:-12px;min-width:105px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;border:1px solid rgba(255,255,255,.3);border-radius:7px;background:rgba(4,39,62,.86);box-shadow:0 10px 30px rgba(0,0,0,.27);backdrop-filter:blur(12px);white-space:nowrap}.tag b{font-size:9px;letter-spacing:.14em}.tag small{color:#9fd8d5;font-size:8px;letter-spacing:.12em}.marker.secondary .core{background:#ffe7ab;box-shadow:0 0 15px rgba(255,218,136,.9)}.marker.secondary .pulse{border-color:rgba(255,223,152,.75)}.marker.secondary .tag small{color:#e9c981}@keyframes pulse{0%{transform:scale(.55);opacity:1}80%,100%{transform:scale(2.1);opacity:0}}@media(max-width:600px){.layers{top:14px;right:14px;width:190px}.info{left:14px;bottom:18px}.maplibregl-ctrl-group{margin-right:14px!important}}
  </style>
</head>
<body>
  <div id="map"></div><div class="shade"></div>
  <div class="layers"><span>GLOBE VIEW · DRAG TO EXPLORE</span><div class="segment"><button id="liberty" class="active">해양</button><button id="bright">밝게</button></div><button id="depth" class="depth active"><i></i>국가 경계 표시</button></div>
  <div class="info"><span>EARTH VIEW · AUTO ROTATE</span><strong id="selected-name">여행지를 불러오는 중</strong><small id="selected-detail">지구를 드래그해 둘러보고, 목적지를 선택해 보세요.</small></div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    const styles={liberty:'https://tiles.openfreemap.org/styles/liberty',bright:'https://tiles.openfreemap.org/styles/bright'};
    const map=new maplibregl.Map({container:'map',style:styles.liberty,center:[124.18,24.43],zoom:.7,minZoom:0,renderWorldCopies:false,aroundCenter:true});
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    const markers=[];let registeredDestinations=[],focusedCountryCode='',countriesLoaded=false,boundariesVisible=true,spinTimer=0,spinActive=false,globeReady=false;
    const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function markerElement(item,secondary){const el=document.createElement('div');el.className='marker'+(secondary?' secondary':'');el.innerHTML='<span class="pulse"></span><span class="core"></span><span class="tag"><b>'+esc(item.name).toUpperCase()+'</b><small>'+esc((item.month||'TBD')+' · '+String(item.year||'').slice(-2))+'</small></span>';return el}
    function renderMarkers(destinations){markers.splice(0).forEach(marker=>marker.remove());destinations.forEach(item=>{const marker=new maplibregl.Marker({element:markerElement(item,item.id!=='ishigaki-2026'),anchor:'center'}).setLngLat([item.longitude,item.latitude]).addTo(map);marker.getElement().addEventListener('click',()=>{if(item.href)parent.location.href=item.href;else parent.location.href='/trips/'+encodeURIComponent(item.id)});markers.push(marker)})}
    function fitDestinations(items,maxZoom=9){if(!items.length)return;const bounds=items.reduce((box,item)=>box.extend([item.longitude,item.latitude]),new maplibregl.LngLatBounds([items[0].longitude,items[0].latitude],[items[0].longitude,items[0].latitude]));map.fitBounds(bounds,{padding:70,maxZoom})}
    function setCountryStyle(){if(!countriesLoaded)return;map.setLayoutProperty('countries-fill','visibility',boundariesVisible?'visible':'none');map.setLayoutProperty('countries-line','visibility',boundariesVisible?'visible':'none');map.setPaintProperty('countries-line','line-color',focusedCountryCode?'#bffbea':'rgba(172,226,215,.34)');map.setPaintProperty('countries-line','line-width',focusedCountryCode?1.5:.65)}
    async function addCountries(){try{const response=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');const topology=await response.json();const countries=topojson.feature(topology,topology.objects.countries);map.addSource('countries',{type:'geojson',data:countries});map.addLayer({id:'countries-fill',type:'fill',source:'countries',paint:{'fill-color':'#58d7bd','fill-opacity':.08}});map.addLayer({id:'countries-line',type:'line',source:'countries',paint:{'line-color':'rgba(172,226,215,.34)','line-width':.65}});countriesLoaded=true;setCountryStyle()}catch{}}
    function pauseSpin(){spinActive=false;clearTimeout(spinTimer);map.stop()}
    function startSpin(){if(spinActive||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;spinActive=true;const rotate=()=>{if(!spinActive)return;map.easeTo({bearing:map.getBearing()+100,duration:30000,easing:value=>value,essential:false});map.once('moveend',()=>{if(spinActive)spinTimer=window.setTimeout(rotate,180)})};rotate()}
    function resumeSpin(){clearTimeout(spinTimer);spinTimer=window.setTimeout(startSpin,5000)}
    function resetGlobe(){pauseSpin();map.flyTo({center:[124.18,24.43],zoom:.7,bearing:0,duration:1500,essential:false});resumeSpin()}
    ['mousedown','touchstart','wheel','dragstart','zoomstart'].forEach(event=>map.on(event,()=>{pauseSpin();resumeSpin()}));
    map.on('style.load',()=>{map.setProjection({type:'globe'});addCountries();renderMarkers(registeredDestinations);if(!globeReady){globeReady=true;map.once('idle',startSpin)}});
    document.getElementById('liberty').onclick=()=>setStyle('liberty');document.getElementById('bright').onclick=()=>setStyle('bright');
    function setStyle(name){pauseSpin();document.querySelectorAll('.segment button').forEach(button=>button.classList.toggle('active',button.id===name));countriesLoaded=false;map.setStyle(styles[name]);resumeSpin()}
    document.getElementById('depth').onclick=()=>{boundariesVisible=!boundariesVisible;document.getElementById('depth').classList.toggle('active',boundariesVisible);setCountryStyle()};
    function focusCountry(data){pauseSpin();focusedCountryCode=String(data.countryCode||'').toUpperCase();if(data.destinations?.length)fitDestinations(data.destinations,5);document.getElementById('selected-name').textContent=(data.countryFlag||'🌍')+' '+(data.countryName||focusedCountryCode);document.getElementById('selected-detail').textContent=(data.destinations?.length||0)+'개의 여행 목적지';setCountryStyle()}
    window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='atlas-focus-country'){focusCountry(data);return}if(data.type==='atlas-focus-trips'){pauseSpin();const destinations=(data.destinations||[]).filter(item=>Number.isFinite(item.latitude)&&Number.isFinite(item.longitude));focusedCountryCode='';renderMarkers(destinations);fitDestinations(destinations,7);document.getElementById('selected-name').textContent='🧭 '+(data.participantName||'여행 참석자');document.getElementById('selected-detail').textContent=destinations.length+'개의 참여 여행';setCountryStyle();return}if(data.type==='atlas-reset-view'){focusedCountryCode='';renderMarkers(registeredDestinations);resetGlobe();document.getElementById('selected-name').textContent='JADAMO OCEAN ATLAS';document.getElementById('selected-detail').textContent='지구를 드래그해 둘러보고, 목적지를 선택해 보세요.';setCountryStyle();return}if(data.type!=='atlas-destinations')return;registeredDestinations=(data.destinations||[]).filter(item=>Number.isFinite(item.latitude)&&Number.isFinite(item.longitude));renderMarkers(registeredDestinations);document.getElementById('selected-name').textContent='JADAMO OCEAN ATLAS';document.getElementById('selected-detail').textContent='지구를 드래그해 둘러보고, 목적지를 선택해 보세요.'});
  </script>
</body>
</html>
