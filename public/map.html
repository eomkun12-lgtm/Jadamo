<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JADAMO 다이빙 지구본</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background-color:#05091b;background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.75) 0 1px,transparent 1.5px),radial-gradient(circle at 82% 75%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),radial-gradient(circle at 62% 30%,rgba(143,220,214,.55) 0 1px,transparent 1.5px);background-size:87px 91px,131px 117px,157px 143px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.globe-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.globe{--globe-scale:1;position:relative;width:min(78vw,920px);aspect-ratio:1;overflow:hidden;border:2px solid rgba(222,255,252,.72);border-radius:50%;background:#9dc5cd;box-shadow:0 0 0 10px rgba(164,229,224,.08),0 30px 70px rgba(0,0,0,.5),inset -35px -25px 50px rgba(27,72,86,.2);transform:scale(var(--globe-scale));transition:transform 180ms ease-out}#map{width:100%;height:100%;background:#9dc5cd}.maplibregl-canvas{filter:saturate(.42) brightness(1.15) contrast(.87)}.maplibregl-ctrl-attrib{padding:3px 7px!important;color:#0d4653!important;background:rgba(238,250,249,.82)!important;font-size:8px!important}.maplibregl-ctrl-attrib a{color:#067d89!important}.maplibregl-ctrl-group{margin:0 22px 22px 0!important;border:1px solid rgba(5,41,54,.22)!important;border-radius:10px!important;overflow:hidden;background:rgba(238,250,249,.9)!important}.maplibregl-ctrl-group button+button{border-color:rgba(5,41,54,.14)!important}.maplibregl-ctrl-group button span{filter:brightness(.45) sepia(1) hue-rotate(135deg)}.globe-shine{position:absolute;z-index:3;inset:0;pointer-events:none;border-radius:50%;background:radial-gradient(circle at 28% 23%,rgba(255,255,255,.4),transparent 30%),radial-gradient(circle at 65% 68%,transparent 40%,rgba(8,29,46,.25) 100%)}.map-note{position:absolute;z-index:8;top:22px;right:22px;width:202px;padding:13px 14px;border:1px solid rgba(167,236,227,.24);border-radius:13px;color:#d6f5f0;background:rgba(4,37,52,.86);box-shadow:0 15px 42px rgba(0,0,0,.24);backdrop-filter:blur(14px)}.map-note span{display:block;margin-bottom:8px;color:#75d9cb;font-size:7px;font-weight:800;letter-spacing:.17em}.map-note strong{display:block;font-size:11px;letter-spacing:.06em}.map-note small{display:block;margin-top:5px;color:rgba(225,250,246,.58);font-size:9px;line-height:1.45}.info{position:absolute;z-index:7;left:22px;bottom:24px;min-width:214px;padding:13px 15px;border:1px solid rgba(255,255,255,.18);border-radius:13px;color:#fff;background:rgba(4,37,52,.8);backdrop-filter:blur(14px)}.info span,.info small{display:block}.info span{margin-bottom:7px;color:#8fd8d1;font-size:7px;font-weight:750;letter-spacing:.16em}.info strong{font-size:12px;letter-spacing:.08em}.info small{margin-top:4px;color:rgba(255,255,255,.55);font-size:9px}.marker{position:relative;width:18px;height:18px;cursor:pointer}.core{position:absolute;left:4px;top:4px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#18b9ad;box-shadow:0 0 0 5px rgba(69,220,203,.2),0 5px 16px rgba(0,0,0,.32)}.tag{position:absolute;left:25px;top:-12px;min-width:98px;padding:8px 10px;border:1px solid rgba(255,255,255,.28);border-radius:7px;color:#fff;background:rgba(4,40,57,.88);box-shadow:0 8px 25px rgba(0,0,0,.28);white-space:nowrap}.tag b,.tag small{display:block}.tag b{font-size:9px;letter-spacing:.12em}.tag small{margin-top:2px;color:#94ded4;font-size:8px;letter-spacing:.1em}.marker.secondary .core{background:#f4c86a;box-shadow:0 0 0 5px rgba(244,200,106,.17),0 5px 16px rgba(0,0,0,.32)}.marker.secondary .tag small{color:#f7d98f}@media(max-width:600px){.globe{width:112vw}.map-note{top:14px;right:14px;width:180px}.info{left:14px;bottom:18px}.maplibregl-ctrl-group{margin-right:14px!important}}
  </style>
</head>
<body>
  <div class="globe-wrap"><div class="globe"><div id="map"></div><div class="globe-shine"></div></div></div>
  <div class="map-note"><span>JADAMO OCEAN ATLAS</span><strong>다이빙 지구본 탐색</strong><small>지구본을 드래그해 목적지를 둘러보세요.</small></div>
  <div class="info"><span>REGISTERED DESTINATIONS</span><strong id="selected-name">여행지를 불러오는 중</strong><small id="selected-detail">등록된 목적지를 표시합니다.</small></div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script>
    // At this zoom, the rendered globe reaches the circular viewport on first load.
    const home={center:[140,22],zoom:2.75,bearing:0};const style={version:8,sources:{ocean:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'ocean',type:'raster',source:'ocean',paint:{'raster-saturation':-.45,'raster-contrast':-.1,'raster-brightness-min':.35,'raster-brightness-max':.95}}]};
    const map=new maplibregl.Map({container:'map',style,...home,minZoom:0,maxZoom:18,renderWorldCopies:false,aroundCenter:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    let registered=[];const markers=[];const globe=document.querySelector('.globe');const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function markerElement(item,secondary){const el=document.createElement('div');el.className='marker'+(secondary?' secondary':'');el.innerHTML='<span class="core"></span><span class="tag"><b>'+esc(item.name).toUpperCase()+'</b><small>'+esc((item.month||'TBD')+' · '+String(item.year||'').slice(-2))+'</small></span>';return el}
    function render(items){markers.splice(0).forEach(marker=>marker.remove());items.forEach(item=>{const marker=new maplibregl.Marker({element:markerElement(item,item.id!=='ishigaki-2026'),anchor:'center'}).setLngLat([item.longitude,item.latitude]).addTo(map);marker.getElement().addEventListener('click',()=>parent.location.href=item.href||('/trips/'+encodeURIComponent(item.id)));markers.push(marker)})}
    function fit(items,maxZoom=7){if(!items.length)return;const bounds=items.reduce((box,item)=>box.extend([item.longitude,item.latitude]),new maplibregl.LngLatBounds([items[0].longitude,items[0].latitude],[items[0].longitude,items[0].latitude]));map.fitBounds(bounds,{padding:72,maxZoom,duration:750})}
    function setInfo(title,detail){document.getElementById('selected-name').textContent=title;document.getElementById('selected-detail').textContent=detail}function reset(){map.easeTo({...home,duration:750})}
    function syncGlobeSize(){const scale=Math.min(1.6,1+Math.max(0,map.getZoom()-home.zoom)*.16);globe.style.setProperty('--globe-scale',scale.toFixed(3))}map.on('zoom',syncGlobeSize);map.on('style.load',()=>{map.setProjection({type:'globe'});map.resize();map.jumpTo(home);syncGlobeSize()});
    window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='atlas-focus-country'){const items=(data.destinations||[]).filter(item=>Number.isFinite(item.latitude)&&Number.isFinite(item.longitude));fit(items,5);setInfo((data.countryFlag||'🌍')+' '+(data.countryName||'여행 국가'),items.length+'개의 여행 목적지');return}if(data.type==='atlas-focus-trips'){const items=(data.destinations||[]).filter(item=>Number.isFinite(item.latitude)&&Number.isFinite(item.longitude));render(items);fit(items,7);setInfo('🧭 '+(data.participantName||'여행 참석자'),items.length+'개의 참여 여행');return}if(data.type==='atlas-reset-view'){render(registered);reset();setInfo('JADAMO OCEAN ATLAS','등록된 목적지를 탐색해 보세요.');return}if(data.type!=='atlas-destinations')return;registered=(data.destinations||[]).filter(item=>Number.isFinite(item.latitude)&&Number.isFinite(item.longitude));render(registered);reset();setInfo('JADAMO OCEAN ATLAS','지구본을 드래그해 목적지를 둘러보세요.')});
  </script>
</body>
</html>
