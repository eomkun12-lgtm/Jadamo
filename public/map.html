<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>이시가키 여행 지도</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{background:#0b2327;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#map{min-height:520px}.base-tiles{filter:saturate(.78) contrast(1.03) brightness(.84) sepia(.04)}.ocean-tiles{filter:saturate(.9) contrast(1.02) brightness(.96)}.bathymetry-tiles{filter:saturate(.86) contrast(1.06)}.reference-tiles{filter:drop-shadow(0 1px 1px rgba(0,0,0,.8)) brightness(1.18)}.leaflet-container{background:#0b2327}.leaflet-control-attribution{padding:3px 7px!important;color:#afc9c2!important;background:rgba(5,18,20,.76)!important;font-size:8px!important}.leaflet-control-attribution a{color:#b7e5d8!important}.leaflet-control-zoom{margin:0 24px 28px 0!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:11px!important;overflow:hidden}.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:34px!important;border-color:rgba(255,255,255,.1)!important;color:#fff!important;background:rgba(8,25,27,.82)!important}.shade{position:absolute;z-index:500;inset:0;pointer-events:none;box-shadow:inset 0 0 65px rgba(2,13,15,.28)}.layers{position:absolute;z-index:800;top:22px;right:22px;width:204px;padding:13px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(5,35,55,.82);box-shadow:0 16px 45px rgba(0,0,0,.22);backdrop-filter:blur(18px)}.layers>span{display:block;margin:0 2px 10px;color:rgba(255,255,255,.45);font-size:7px;font-weight:750;letter-spacing:.18em}.segment{padding:3px;display:grid;grid-template-columns:repeat(3,1fr);border-radius:9px;background:rgba(0,0,0,.23)}button{height:31px;border:0;border-radius:7px;color:rgba(255,255,255,.56);background:transparent;font-size:10px;cursor:pointer}.segment button.active{color:#07304a;background:#d8f3f2;font-weight:720}.depth{width:100%;padding:9px 3px 1px;display:flex;align-items:center;gap:8px;text-align:left}.depth i{width:8px;height:8px;border:1px solid rgba(255,255,255,.45);border-radius:50%}.depth.active{color:#c7eeea}.depth.active i{border-color:#a9e7d4;background:#56c8bd;box-shadow:0 0 0 4px rgba(117,206,181,.12)}.info{position:absolute;z-index:700;left:22px;bottom:24px;min-width:214px;padding:14px 16px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(5,35,55,.76);backdrop-filter:blur(15px)}.info span,.info small{display:block}.info span{margin-bottom:7px;color:#8fd8d1;font-size:7px;font-weight:750;letter-spacing:.16em}.info strong{font-size:12px;letter-spacing:.08em}.info small{margin-top:4px;color:rgba(255,255,255,.5);font-size:9px}.marker{position:relative}.core{position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:#e5fff5;box-shadow:0 0 18px #a5f5da}.pulse{position:absolute;left:-3px;top:-3px;width:26px;height:26px;border:1px solid rgba(205,255,236,.85);border-radius:50%;animation:pulse 2.2s ease-out infinite}.tag{position:absolute;left:27px;top:-12px;min-width:105px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;border:1px solid rgba(255,255,255,.3);border-radius:7px;background:rgba(4,39,62,.86);box-shadow:0 10px 30px rgba(0,0,0,.27);backdrop-filter:blur(12px)}.tag b{font-size:9px;letter-spacing:.14em}.tag small{color:#9fd8d5;font-size:8px;letter-spacing:.12em}.marker.secondary .core{background:#ffe7ab;box-shadow:0 0 15px rgba(255,218,136,.9)}.marker.secondary .pulse{border-color:rgba(255,223,152,.75)}.marker.secondary .tag small{color:#e9c981}.island-label{position:relative!important;width:118px!important;height:28px!important;padding:5px 7px 5px 15px!important;display:grid!important;grid-template-columns:1fr auto;align-items:center;border:1px solid rgba(12,54,78,.22);border-radius:4px;color:#0b3650;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(12,55,76,.14);white-space:nowrap}.island-label>span{position:absolute;left:6px;width:5px;height:5px;border-radius:50%;background:#0a6683}.island-label b{font-size:8px;letter-spacing:.05em}.island-label small{font-size:7px;color:#5d7886}@keyframes pulse{0%{transform:scale(.55);opacity:1}80%,100%{transform:scale(2.1);opacity:0}}@media(max-width:600px){.layers{top:14px;right:14px;width:190px}.info{left:14px;bottom:18px}.leaflet-control-zoom{margin-right:14px!important}}
  </style>
</head>
<body>
  <div id="map"></div><div class="shade"></div>
  <div class="layers"><span>MAP VIEW</span><div class="segment"><button id="ocean" class="active">해양</button><button id="sat">위성</button><button id="topo">지형</button></div><button id="depth" class="depth active"><i></i>해저 음영</button></div>
  <div class="info"><span>REGISTERED DESTINATIONS</span><strong id="selected-name">여행지를 불러오는 중</strong><small id="selected-detail">등록된 여행 포인트만 표시합니다</small></div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const map=L.map('map',{center:[24.43,124.18],zoom:8,zoomControl:false});
    const ocean=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',{className:'ocean-tiles',attribution:'Ocean basemap © Esri, GEBCO, NOAA',maxZoom:16}).addTo(map);
    const imagery=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{className:'base-tiles',attribution:'Tiles © Esri',maxZoom:18});
    const topo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',{className:'base-tiles',attribution:'Terrain © Esri',maxZoom:18});
    const bathy=L.tileLayer.wms('https://wms.gebco.net/mapserv?',{className:'bathymetry-tiles',layers:'GEBCO_Latest',format:'image/png',transparent:true,opacity:.28,attribution:'Bathymetry © GEBCO'}).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);
    const customMarkers=L.layerGroup().addTo(map);
    function markerIcon(name,date,secondary=false){return L.divIcon({className:'marker'+(secondary?' secondary':''),html:'<span class="pulse"></span><span class="core"></span><span class="tag"><b>'+name.replace(/[<>]/g,'')+'</b><small>'+date.replace(/[<>]/g,'')+'</small></span>',iconSize:[20,20],iconAnchor:[10,10]})}
    const oce=document.getElementById('ocean'),sat=document.getElementById('sat'),topoButton=document.getElementById('topo'),dep=document.getElementById('depth');
    function stack(){if(map.hasLayer(bathy))bathy.bringToFront();customMarkers.bringToFront()}
    function selectBase(layer,button){[ocean,imagery,topo].forEach(item=>map.removeLayer(item));layer.addTo(map);[oce,sat,topoButton].forEach(item=>item.classList.remove('active'));button.classList.add('active');stack()}
    oce.onclick=()=>selectBase(ocean,oce);
    sat.onclick=()=>selectBase(imagery,sat);
    topoButton.onclick=()=>selectBase(topo,topoButton);
    dep.onclick=()=>{if(map.hasLayer(bathy)){map.removeLayer(bathy);dep.classList.remove('active')}else{bathy.addTo(map);dep.classList.add('active');stack()}};
    window.addEventListener('message',(event)=>{
      if(event.origin!==location.origin||event.data?.type!=='atlas-destinations')return;
      customMarkers.clearLayers();
      const registered=event.data.destinations.filter(item=>Number.isFinite(item.latitude)&&Number.isFinite(item.longitude));
      registered.forEach(item=>L.marker([item.latitude,item.longitude],{icon:markerIcon(item.name.toUpperCase(),(item.month||'TBD')+' ’'+String(item.year||'').slice(-2),item.id!=='ishigaki-2026')}).addTo(customMarkers).on('click',()=>parent.location.href=item.href||('/trips/'+encodeURIComponent(item.id))));
      const selected=registered[0];
      document.getElementById('selected-name').textContent=selected?selected.name.toUpperCase():'등록된 여행지 없음';
      document.getElementById('selected-detail').textContent=selected?(selected.region||((selected.month||'TBD')+' · '+(selected.year||''))):'새 여행지를 추가하면 지도에 표시됩니다';
      if(registered.length){map.fitBounds(registered.map(item=>[item.latitude,item.longitude]),{padding:[70,70],maxZoom:9})}
      stack();
    });
  </script>
</body>
</html>
