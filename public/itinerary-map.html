<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:#082631;font-family:Arial,"Noto Sans KR",sans-serif}#map{min-height:330px}.maplibregl-ctrl-attrib{font-size:7px!important;background:rgba(4,24,31,.78)!important;color:#b9d2d3!important}.maplibregl-ctrl-attrib a{color:#a9e4df!important}.pin{width:30px;height:30px;display:grid;place-items:center;border:2px solid #fff;border-radius:50%;color:#062d38;background:#f2c45f;box-shadow:0 8px 22px rgba(0,0,0,.3);font:800 10px sans-serif;cursor:pointer}.maplibregl-popup-content{max-width:230px;border-radius:12px;color:#173844}.maplibregl-popup-content b,.maplibregl-popup-content span{display:block}.maplibregl-popup-content span{margin-top:4px;color:#57747b;font-size:10px}.state{position:absolute;z-index:2;top:50%;left:50%;padding:10px 13px;border:1px solid rgba(181,232,224,.25);border-radius:12px;color:#dff4ef;background:rgba(4,37,49,.92);font-size:10px;transform:translate(-50%,-50%)}.state[hidden]{display:none}</style>
</head>
<body>
  <div id="map" aria-label="시간순 여행 경로 지도"></div><div class="state" id="state">일정 장소를 지도에 표시하는 중…</div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script>
    const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[124.15,24.34],zoom:10,minZoom:2,maxZoom:18,renderWorldCopies:false});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');let markers=[],pending=[],pendingTotal=0,lastRequest='';const state=document.getElementById('state');const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));const fixedCoordinates={'462-1 Ohama, Ishigaki, Okinawa 907-0001 일본':[124.1921401,24.3414496],'Euglena Mall, Ishigaki':[124.1602778,24.3430556]};
    async function coordinates(location,context){if(fixedCoordinates[location])return fixedCoordinates[location];const center=Number.isFinite(Number(context?.longitude))&&Number.isFinite(Number(context?.latitude))?[Number(context.longitude),Number(context.latitude)]:null;const key='jadamo-geocode-v3:'+location+':'+(center?.join(',')||'world');try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(cached)&&cached.length===2)return cached}catch{}const viewbox=center?'&viewbox='+(center[0]-2)+','+(center[1]+2)+','+(center[0]+2)+','+(center[1]-2):'';try{const response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(location)+viewbox,{headers:{'Accept-Language':'ko,en'}});if(!response.ok)return null;const results=await response.json();const candidates=results.map(result=>[Number(result.lon),Number(result.lat)]).filter(value=>value.every(Number.isFinite));const value=center?candidates.sort((a,b)=>Math.hypot(a[0]-center[0],a[1]-center[1])-Math.hypot(b[0]-center[0],b[1]-center[1]))[0]:candidates[0];try{if(value)localStorage.setItem(key,JSON.stringify(value))}catch{}return value||null}catch{return null}}
    function render(points,total){markers.forEach(marker=>marker.remove());markers=[];if(map.getLayer('route'))map.removeLayer('route');if(map.getSource('route'))map.removeSource('route');if(points.length>1){map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:points.map(point=>point.coordinates)}}});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#087f8e','line-width':4,'line-opacity':.82,'line-dasharray':[1.5,1]}})}points.forEach(point=>{const element=document.createElement('button');element.className='pin';element.type='button';element.textContent=String(point.order).padStart(2,'0');element.setAttribute('aria-label',point.title+' 일정');markers.push(new maplibregl.Marker({element}).setLngLat(point.coordinates).setPopup(new maplibregl.Popup({offset:18}).setHTML('<b>'+esc(point.title)+'</b><span>'+esc([point.date,point.time,point.location].filter(Boolean).join(' · '))+'</span>')).addTo(map))});if(points.length===1)map.flyTo({center:points[0].coordinates,zoom:14});else if(points.length){const bounds=points.reduce((box,point)=>box.extend(point.coordinates),new maplibregl.LngLatBounds(points[0].coordinates,points[0].coordinates));map.fitBounds(bounds,{padding:55,maxZoom:14})}const missing=total-points.length;state.textContent=points.length?(missing?missing+'개 장소는 좌표를 찾지 못했습니다.':points.length+'개 장소를 시간순으로 연결했습니다.'):'장소 좌표를 찾지 못했습니다.';state.hidden=!missing&&Boolean(points.length)}
    async function apply(items,context){state.hidden=false;state.textContent='일정 장소를 지도에 표시하는 중…';const points=[];const cache=new Map();for(const item of items){let value=cache.get(item.location);if(value===undefined){value=await coordinates(item.location,context);cache.set(item.location,value);await wait(1100)}if(value)points.push({...item,coordinates:value})}pending=points;pendingTotal=items.length;if(map.loaded())render(points,pendingTotal)}
    map.on('load',()=>render(pending,pendingTotal));window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='itinerary-route')return;const items=Array.isArray(event.data.items)?event.data.items:[];const request=JSON.stringify([items,event.data.context]);if(request===lastRequest)return;lastRequest=request;void apply(items,event.data.context)});
  </script>
</body>
</html>
